repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint (auto-fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pytest
        name: unit tests
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty type check
        entry: uv run ty check src/stumble scripts
        language: system
        pass_filenames: false
        types: [python]
